<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뭉쳐 달려</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; HUD pinned to the top edge, panels docked at the bottom. Single committed look. */
:root {
  --sky-top: #3f9be0;
  --sky-low: #e3f4fb;
  --ink: #1c2541;
  --paper: #fff8e7;
  --sun: #ffd23f;
  --sun-deep: #d9a400;
  --rival: #ff4d6d;
  --good: #2f9bff;
  --muted: #5f6f94;
  --star-off: #d8d0b8;
  --locked: #a9c6e6;
  --sea-1: #2a78bd; --sea-2: #2f8fa8; --sea-3: #5f7fc4; --sea-4: #262f6e;
  --wood: #b5763f; --wood-deep: #7d4c22;
  --font-display: 'Jua', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; font-size: 14px;
  background: var(--ink);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#app {
  position: relative; height: 100%; overflow: hidden;
  background:
    radial-gradient(circle at 76% 22%, rgba(255, 251, 226, .98) 0 3%, rgba(255, 251, 226, .4) 4.5%, rgba(255, 251, 226, 0) 17%),
    linear-gradient(var(--sky-top), var(--sky-low) 48%);
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Count tags that follow crowds */
.tag {
  position: absolute; left: 0; top: 0;
  font-family: var(--font-display); font-size: 22px; line-height: 1;
  padding: 5px 12px 4px; border-radius: 999px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  will-change: transform;
}
.tag.me { background: var(--sun); color: var(--ink); box-shadow: 0 3px 0 var(--sun-deep); font-size: 26px; }
.tag.foe { background: var(--rival); color: var(--paper); box-shadow: 0 3px 0 #b3203d; }
.floater {
  position: absolute; left: 0; top: 0;
  font-family: var(--font-display); font-size: 34px; color: var(--paper);
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
  animation: rise .8s ease-out forwards;
}
.floater.bad { color: var(--rival); }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -70px; } }

/* HUD */
#hud {
  position: absolute; inset: 0 0 auto 0;
  display: flex; align-items: center; gap: 10px;
  padding-block: 12px; pointer-events: none;
}
.chip {
  font-family: var(--font-display); font-size: 17px; line-height: 1;
  background: var(--ink); color: var(--paper);
  padding: 9px 13px 8px; border-radius: 999px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.chip.coin::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  background: var(--sun); box-shadow: inset 0 -2px 0 var(--sun-deep); margin-right: 6px; vertical-align: -1px; }
#bar { flex: 1; min-width: 0; height: 12px; border-radius: 999px; background: rgba(28, 37, 65, .28); overflow: hidden; }
#barFill { height: 100%; width: 0; background: var(--sun); border-radius: 999px; }
#mute {
  pointer-events: auto; cursor: pointer; border: 0;
  font-family: var(--font-display); font-size: 15px;
  background: var(--paper); color: var(--ink);
  padding: 8px 12px 7px; border-radius: 999px;
}

/* Menu */
#menu { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; padding-block: 64px 20px; }
#menu h1 {
  margin: 0; text-align: center; text-wrap: balance;
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(52px, 15vw, 96px); line-height: .95; color: var(--sun);
  text-shadow: 0 5px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink),
    3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 12px 0 rgba(28, 37, 65, .25);
  transform: rotate(-3deg);
}
.dock { pointer-events: auto; width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  background: var(--ink); border-radius: 24px; padding: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); }
.dock .chip { background: rgba(255, 248, 231, .12); }
.dock-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.upgrades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.up {
  cursor: pointer; text-align: left; border: 0; border-radius: 16px;
  background: var(--paper); color: var(--ink);
  padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;
  font-family: var(--font-body); min-width: 0;
}
.up b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.up span { font-size: 12.5px; color: var(--muted); }
.up .cost { font-family: var(--font-display); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.up:disabled { cursor: default; }
.up:disabled .cost { color: var(--muted); }
.go {
  cursor: pointer; border: 0; border-radius: 20px;
  background: var(--sun); color: var(--ink);
  font-family: var(--font-display); font-size: 30px; line-height: 1;
  padding: 17px 20px 15px; box-shadow: 0 6px 0 var(--sun-deep);
}
.go:active, .up:not(:disabled):active { transform: translateY(3px); }
.go.alt { background: var(--paper); box-shadow: 0 6px 0 rgba(28, 37, 65, .35); font-size: 20px; padding-block: 13px 11px; }
.hint { margin: 0; text-align: center; font-size: 13.5px; color: var(--paper); opacity: .85; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Result */
#result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(28, 37, 65, .45); padding-block: 20px; }
.card {
  width: 100%; max-width: 380px; background: var(--paper); border-radius: 26px;
  padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center;
  box-shadow: 0 8px 0 rgba(28, 37, 65, .5);
}
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.card .gain { font-family: var(--font-display); font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; }
.go-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.go-row .go.alt { font-size: 22px; padding-inline: 22px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stars { font-size: 34px; line-height: 1; letter-spacing: 4px; color: var(--sun-deep); }
.stars i, .st i { font-style: normal; }
.stars .off { color: var(--star-off); }

/* Expedition map */
#map { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--sea-1); color: var(--paper); }
.map-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; background: var(--ink); }
.map-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.map-head .chip { background: rgba(255, 248, 231, .12); }
.pill { cursor: pointer; border: 0; font-family: var(--font-display); font-size: 15px; background: var(--paper); color: var(--ink); padding: 8px 13px 7px; border-radius: 999px; }
#mapScroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
#mapTrail { position: relative; }
#mapTrail svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.zone-name {
  position: absolute; left: 50%; transform: translate(-50%, -50%); white-space: nowrap;
  font-family: var(--font-display); font-size: 15px; background: var(--wood); color: var(--paper);
  padding: 7px 14px 6px; border-radius: 7px; box-shadow: 0 4px 0 var(--wood-deep);
}
.zone-name::after { content: ""; position: absolute; left: 50%; top: 100%; width: 8px; height: 14px; margin-left: -4px; background: var(--wood-deep); border-radius: 0 0 3px 3px; }
.zone-name b { font-weight: 400; color: var(--sun); margin-left: 8px; font-variant-numeric: tabular-nums; }
.map-chips { display: flex; gap: 6px; }
.map-chips .star { color: var(--sun); }
.node {
  position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 0; cursor: pointer;
  background: transparent; color: var(--ink); font-family: var(--font-display); font-size: 23px;
  font-variant-numeric: tabular-nums;
}
.node.sel { outline: 3px solid var(--paper); outline-offset: 3px; }
.node:disabled { color: var(--muted); cursor: default; }
.node .st {
  position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 7px;
  font-size: 13px; line-height: 1; letter-spacing: 1px; white-space: nowrap; color: var(--sun);
  background: var(--ink); padding: 3px 6px 3px 7px; border-radius: 999px;
}
.node .st .off { color: rgba(255, 248, 231, .35); }
.pg-w { animation: waddle .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes waddle { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.bobber { animation: bob 2.4s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
.aur { animation: glow 5s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .55; } to { opacity: 1; } }
.tw { animation: glow 1.8s ease-in-out infinite alternate; }
.pop { animation: pop .55s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
#sheet { position: absolute; inset: auto 0 0 0; padding-block: 0 14px; pointer-events: none; }
.sheet-card {
  pointer-events: auto; max-width: 440px; margin: 0 auto; background: var(--paper); color: var(--ink);
  border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 6px 0 rgba(28, 37, 65, .5);
}
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-top h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.sheet-top small { display: block; font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.sheet-card p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
.sheet-card p b { color: var(--ink); font-variant-numeric: tabular-nums; }
.feats { display: flex; flex-wrap: wrap; gap: 6px; }
.feats span { font-size: 12.5px; font-weight: 700; background: rgba(28, 37, 65, .09); color: var(--ink); padding: 5px 10px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { .pg-w, .bobber, .aur, .tw, .pop { animation: none; } }
#fail { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--ink); color: var(--paper); font-size: 16px; line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { .floater { animation-duration: .01s; } }
</style>

<div id="app">
  <canvas id="stage"></canvas>
  <div id="labels"></div>

  <div id="hud" class="gutter" hidden>
    <span class="chip" id="hStage">스테이지 1</span>
    <div id="bar" role="progressbar" aria-label="진행도"><div id="barFill"></div></div>
    <span class="chip coin" id="hCoins">0</span>
    <button id="mute" type="button">소리 켬</button>
  </div>

  <section id="menu" class="gutter">
    <h1>뭉쳐 달려</h1>
    <div class="dock">
      <div class="dock-head">
        <span class="chip" id="mStage">스테이지 1</span>

      <div class="upgrades">
        <button class="up" id="upStart" type="button">
          <b>시작 인원</b><span id="upStartNow">1명으로 출발</span><span class="cost" id="upStartCost"></span>
        </button>
        <button class="up" id="upIncome" type="button">
          <b>코인 수익</b><span id="upIncomeNow">보상 100%</span><span class="cost" id="upIncomeCost"></span>
        </button>
      </div>
      <div class="go-row">
        <button class="go" id="start" type="button">달리기</button>
        <button class="go alt" id="openMap" type="button">지도</button>
      </div>
      <p class="hint">좌우로 드래그하거나 ← → 키로 게이트를 고르세요</p>
    </div>
  </section>

  <section id="result" class="gutter" hidden>
    <div class="card">
      <h2 id="rTitle"></h2>
      <div class="stars" id="rStars" hidden></div>
      <p id="rText"></p>
      <div class="gain" id="rGain"></div>
      <button class="go" id="rMain" type="button"></button>
      <div class="two">
        <button class="go alt" id="rMap" type="button">지도</button>
        <button class="go alt" id="rMenu" type="button">업그레이드</button>
      </div>
    </div>
  </section>

  <section id="map" hidden>
    <header class="map-head gutter">
      <button class="pill" id="mapBack" type="button">돌아가기</button>
      <h2>탐험 지도</h2>
      <div class="map-chips"><span class="chip" id="mapStars"></span><span class="chip coin" id="mapCoins">0</span></div>
    </header>
    <div id="mapScroll"><div id="mapTrail" class="gutter"></div></div>
    <div id="sheet" class="gutter">
      <div class="sheet-card">
        <div class="sheet-top">
          <h3><span id="sTitle"></span><small id="sZone"></small></h3>
          <div class="stars" id="sStars"></div>
        </div>
        <p id="sBest"></p>
        <div class="feats" id="sFeats"></div>
        <p id="sNote" hidden>이미 깬 스테이지라 코인은 절반만 받아요.</p>
        <button class="go" id="sGo" type="button">달리기</button>
      </div>
    </div>
  </section>

  <p id="fail" hidden>3D 화면을 불러오지 못했어요. 네트워크 연결을 확인하고 새로 고쳐 주세요.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const fail = () => { $('fail').hidden = false; $('menu').hidden = true; };
if (!window.THREE) { fail(); return; }

const W = 5;            // road half width
const SPEED = 14;       // forward units per second
const MAXU = 150;       // max drawn units in the player's crowd
const SPACING = 0.5;
const SIZE = 1.4;       // character scale
const SEG = 24;         // distance between level segments
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Save ---------- */
const Save = {
  key: 'mungchyeo-run-v1',
  data: { level: 1, coins: 0, upStart: 0, upIncome: 0, muted: false, stars: {}, best: {} },
  load() {
    try {
      const r = JSON.parse(localStorage.getItem(this.key));
      if (r && typeof r === 'object') {
        for (const k of Object.keys(this.data)) if (r[k] !== null && typeof r[k] === typeof this.data[k]) this.data[k] = r[k];
      }
    } catch (e) { /* storage unavailable: play without saving */ }
  },
  store() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ } }
};
Save.load();

/* ---------- Level generation ---------- */
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function applyOp(n, g) {
  switch (g.op) {
    case '+': return n + g.v;
    case '×': return n * g.v;
    case '−': return Math.max(1, n - g.v);
    default: return Math.max(1, Math.ceil(n / g.v));
  }
}
const nice = n => n > 40 ? Math.round(n / 10) * 10 : n > 15 ? Math.round(n / 5) * 5 : Math.round(n);

function genLevel(level) {
  const rnd = mulberry32(level * 7919 + 13);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const rf = (a, b) => a + rnd() * (b - a);
  const n = Math.min(5 + Math.floor(level * 0.8), 14);
  const kinds = [];
  if (level >= 2) kinds.push('spinner');
  if (level >= 3) kinds.push('pit');
  if (level >= 5) kinds.push('slider');
  const segs = [];
  let best = 1, mults = 0, tripled = false, last = '';
  const good = () => {
    if (mults < 4 && best >= 3 && best < 300 && rnd() < 0.45) {
      mults++;
      if (!tripled && rnd() < 0.2) { tripled = true; return { op: '×', v: 3, good: true }; }
      return { op: '×', v: 2, good: true };
    }
    return { op: '+', v: Math.max(2, nice(best * rf(0.4, 1.4) + ri(1, 4))), good: true };
  };
  const bad = () => rnd() < 0.6
    ? { op: '−', v: Math.max(1, nice(best * rf(0.2, 0.6))), good: false }
    : { op: '÷', v: 2, good: false };

  for (let i = 0; i < n; i++) {
    let kind = 'gate';
    const r = rnd();
    if (i > 0 && i < n - 1) {
      if (r < 0.25 && best >= 6 && last !== 'enemy') kind = 'enemy';
      else if (r >= 0.25 && r < 0.5 && kinds.length && best >= 4 && last === 'gate') kind = 'hazard';
    }
    const z = -(30 + i * SEG);
    if (kind === 'gate') {
      const a = good();
      let b = rnd() < 0.45 ? good() : bad();
      if (a.op === b.op && a.v === b.v) b = bad();
      best = Math.max(applyOp(best, a), applyOp(best, b));
      const flip = rnd() < 0.5;
      segs.push({ kind, z, left: flip ? b : a, right: flip ? a : b });
    } else if (kind === 'enemy') {
      const size = Math.max(1, Math.round(best * rf(0.25, 0.5)));
      best -= size;
      segs.push({ kind, z, size, x: rf(-2, 2) });
    } else {
      best = Math.max(1, Math.floor(best * 0.9));
      segs.push({ kind, z, type: kinds[ri(0, kinds.length - 1)], side: rnd() < 0.5 ? -1 : 1 });
    }
    last = kind;
  }
  const ratio = 0.4 + Math.min(level, 20) * 0.015;
  return { level, segs, best, boss: Math.max(1, Math.floor(best * ratio)), bossZ: -(30 + n * SEG + 10) };
}

/* ---------- Renderer ---------- */
const app = $('app'), canvas = $('stage'), labels = $('labels');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { fail(); return; }
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe3f4fb).convertSRGBToLinear(), 60, 150);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 300);
// Warm low sun ahead and to the right; the sky fills shaded sides with blue.
scene.add(new THREE.HemisphereLight(0xf4fbff, 0x86bdea, 0.78));
const sun = new THREE.DirectionalLight(0xfff1d8, 0.7);
sun.position.set(22, 40, -54);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 44, bottom: -44, near: 1, far: 130 });
scene.add(sun, sun.target);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Real shadows are switched off automatically on devices that cannot keep up.
const Q = { shadows: true, locked: false, slow: 0 };
function setShadows(on) {
  Q.shadows = on; sun.castShadow = on;
  if (!on) renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
}

let portrait = false;
function resize() {
  const w = app.clientWidth || 1, h = app.clientHeight || 1;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  portrait = camera.aspect < 0.8;
  const half = Math.atan(Math.tan(27 * Math.PI / 180) / camera.aspect) * 180 / Math.PI;
  camera.fov = clamp(half * 2, 52, 84);
  camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
window.addEventListener('resize', resize);
resize();

/* ---------- Crowd ---------- */
// Characters are built once from simple shapes with per-vertex colours, then drawn as instances.
function tint(g, hex) {
  if (g.index) g = g.toNonIndexed();
  const c = new THREE.Color(hex).convertSRGBToLinear(), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
function ball(r, sx, sy, sz, x, y, z, hex, seg) {
  const g = new THREE.SphereGeometry(r, seg || 10, seg ? Math.max(4, seg - 2) : 8);
  g.scale(sx, sy, sz); g.translate(x, y, z);
  return tint(g, hex);

function waves(ctx, w, n, seed, styles, width) {
  const r = mulberry32(seed);
  ctx.lineCap = 'round'; ctx.lineWidth = width;
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = r() * w, len = 18 + r() * 46, bend = (r() - 0.5) * 14;
    ctx.strokeStyle = styles[i % styles.length];
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      ctx.beginPath(); ctx.moveTo(x + ox * w, y + oy * w);
      ctx.quadraticCurveTo(x + ox * w + len / 2, y + oy * w + bend, x + ox * w + len, y + oy * w);
      ctx.stroke();
    }
  }
}

const Sfx = {
  ctx: null, lastHit: 0,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio */ } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type, v, slide) {
    if (Save.data.muted || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + d);
  },
  good() { this.tone(520, 0.12, 'triangle', 0.14, 400); },
  bad() { this.tone(220, 0.2, 'sawtooth', 0.08, -120); },
  hit() { const n = performance.now(); if (n - this.lastHit < 60) return; this.lastHit = n; this.tone(160 + Math.random() * 60, 0.06, 'square', 0.05); },

    else {

      b.addEventListener('click', () => selectStage(i));
      if (i < d.level) { const st = document.createElement('span'); st.className = 'st'; drawStars(st, earned(i)); b.appendChild(st); }
    }
    trail.appendChild(b);
  }
}
// After a first clear, the penguin walks along the trail from the stage just beaten to the newly opened one.
function walkPenguin(from, to) {
  const a = mapPts[from - 1], b = mapPts[to - 1];
  if (!a || !b || calm) return;
  pengAt(a[0], a[1]);
  walkTimer = setTimeout(() => {
    const m = (a[1] + b[1]) / 2;
    const seg = sv('path', { d: `M${a[0]},${a[1]} C${a[0]},${m} ${b[0]},${m} ${b[0]},${b[1]}`, fill: 'none' }, mapSvg);
    const len = seg.getTotalLength(), t0 = performance.now();
    const tick = now => {
      const u = Math.min(1, (now - t0) / 1300), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const p = seg.getPointAtLength(len * e);
      pengAt(p.x, p.y);
      if (u < 1) walkRaf = requestAnimationFrame(tick);
      else { seg.remove(); if (mapNodeArt[to - 1]) mapNodeArt[to - 1].classList.add('pop'); }
    };
    walkRaf = requestAnimationFrame(tick);
  }, 350);
}
function selectStage(n) {
  const d = Save.data, prev = $('node' + mapSel), cur = $('node' + n);
  if (prev) prev.classList.remove('sel');
  if (cur) cur.classList.add('sel');
  mapSel = n;
  const lv = genLevel(n), done = n < d.level;
  $('sTitle').textContent = '스테이지 ' + n;
  $('sZone').textContent = zoneName(n);
  drawStars($('sStars'), earned(n));
  const best = $('sBest');
  best.textContent = '';
  if (d.best[n]) { best.append('최고 기록 '); const b = document.createElement('b'); b.textContent = d.best[n].toLocaleString('ko-KR') + '명'; best.append(b, ' 생존'); }
  else best.textContent = done ? '클리어한 스테이지예요.' : '아직 기록이 없어요. 보스 무리는 ' + lv.boss.toLocaleString('ko-KR') + '마리예요.';
  const has = t => lv.segs.some(q => q.type === t || q.kind === t);
  const feats = [['spinner', '고드름 막대'], ['pit', '얼음 구멍'], ['slider', '얼음 벽'], ['enemy', '게 무리']].filter(f => has(f[0]));
  const box = $('sFeats');
  box.textContent = '';
  for (const f of feats.length ? feats : [['', '게이트만 나와요']]) { const c = document.createElement('span'); c.textContent = f[1]; box.appendChild(c); }
  $('sNote').hidden = !done;
}
function openMap(walkFrom) {
  toMenu();
  $('menu').hidden = true; $('map').hidden = false;
  mapSel = Save.data.level;
  renderMap(); selectStage(mapSel);
  const sc = $('mapScroll');
  sc.scrollTop = stageY(mapSel) - (sc.clientHeight - 230) / 2;
  if (walkFrom && walkFrom === mapSel - 1) walkPenguin(walkFrom, mapSel);
}
function playStage(n) { G.stage = clamp(n, 1, Save.data.level); startRun(true); }

/* ---------- Floating text ---------- */
const v3 = new THREE.Vector3();
function toScreen(x, y, z) {
  v3.set(x, y, z).project(camera);
  if (v3.z > 1 || v3.z < -1) return null;
  return [(v3.x + 1) / 2 * app.clientWidth, (1 - v3.y) / 2 * app.clientHeight];
}
function floater(text, bad) {
  const p = toScreen(G.x, 3.2, G.z); if (!p) return;
  const el = document.createElement('div');
  el.className = 'floater' + (bad ? ' bad' : '');
  el.textContent = text;
  el.style.transform = `translate(${p[0]}px,${p[1]}px) translate(-50%,-50%)`;
  labels.appendChild(el);
  setTimeout(() => el.remove(), 850);
}
const pool = []; let used = 0;
function tag(x, y, z, text, cls) {
  const p = toScreen(x, y, z); if (!p) return;
  let el = pool[used];
  if (!el) { el = document.createElement('div'); labels.appendChild(el); pool.push(el); }
  used++;
  el.className = 'tag ' + cls;
  if (el.textContent !== text) el.textContent = text;
  el.style.transform = `translate(${p[0]}px,${p[1]}px) translate(-50%,-50%)`;
  el.hidden = false;
}

/* ---------- Simulation ---------- */
function hitHazard(h, x, z) {
  const dx = x - h.x, dz = z - h.z;
  if (h.type === 'spinner') {
    const c = Math.cos(h.ang), s = Math.sin(h.ang);
    return Math.abs(dx * c - dz * s) < 3.3 && Math.abs(dx * s + dz * c) < 0.6;
  }
  if (h.type === 'slider') return Math.abs(dx) < 2.2 && Math.abs(dz) < 0.6;
  return Math.abs(dx) < 2.25 && Math.abs(dz) < 2;
}

function step(dt) {
  G.t += dt;
  for (const h of hazards) {
    if (h.type === 'spinner') { h.ang += dt * 2.3 * h.side; h.mesh.rotation.y = h.ang; }
    else if (h.type === 'slider') { h.x = Math.sin(G.t * 1.5 + h.z) * 2.7; h.mesh.position.x = h.x; }
  }

  if (G.state === 'running') {
    G.z -= (G.fight ? 2.5 : SPEED) * dt;
    G.x = clamp(G.x + ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * 9 * dt, -W + 0.6, W - 0.6);
    player.tiltT = clamp((G.x - G.lastX) / Math.max(dt, 0.001) / 10, -1, 1); G.lastX = G.x;
    player.cx = G.x; player.cz = G.z;

    // Gates: the side the crowd's centre is on decides
    for (const g of gates) {
      if (g.done || G.z > g.z) continue;
      g.done = true;
      const pick = G.x < 0 ? g.left : g.right, other = G.x < 0 ? g.right : g.left;
      G.count = applyOp(G.count, pick.g);
      pick.mesh.visible = false; other.mesh.material.opacity = 0.25;
      floater(pick.g.op + pick.g.v, !pick.g.good);
      if (pick.g.good) { Sfx.good(); player.jump = 1; } else { Sfx.bad(); player.flinch = 1; }
      sync();
    }

    // Hazards remove only the units that touch them
    for (const h of hazards) {
      if (Math.abs(G.z - h.z) > player.radius + 5) continue;
      for (let i = player.n - 1; i >= 0; i--) {
        if (!hitHazard(h, player.wx(i), player.wz(i))) continue;
        G.count = Math.max(0, G.count - Math.max(1, Math.round(G.count / player.n)));
        Fx.kill(player.wx(i), player.wz(i), h.type === 'pit');
        player.removeAt(i);
        h.type === 'pit' ? Sfx.plop() : Sfx.hit();
      }
      if (G.count <= 0) { G.count = 0; player.n = 0; finish(false, '모두 쓰러졌어요'); return; }
      sync();
    }

    // Rival crowds cancel one for one
    for (const f of foes) {
      if (f.dead) continue;
      const gap = G.z - f.view.cz;
      if (!f.isBoss && gap < 18 && gap > 0 && f !== G.fight) {
        f.view.hop = 1; f.view.cz += 3 * dt;
        f.view.cx += (G.x - f.view.cx) * Math.min(1, dt * 1.5);
      }
      if (!G.fight && gap < player.radius + f.view.radius + 0.8) {
        G.fight = f; f.acc = 0; f.view.hop = 1;
        f.rate = Math.max(12, Math.min(G.count, f.size) / (f.isBoss ? 1.5 : 0.8));
      }
    }
    const f = G.fight;
    if (f) {
      f.acc += f.rate * dt;
      const k = Math.min(Math.floor(f.acc), G.count, f.size);
      if (k > 0) { f.acc -= k; G.count -= k; f.size -= k; Sfx.hit(); Fx.clash((G.x + f.view.cx) / 2, (G.z + f.view.cz) / 2, k); }
      f.view.cx += (G.x - f.view.cx) * Math.min(1, dt * 4);
      f.view.setCount(f.size); if (f.view.n > f.size) f.view.n = f.size;
      sync(); if (player.n > G.count) player.n = G.count;
      if (G.count <= 0) { finish(false, f.isBoss ? '보스 무리가 더 많았어요' : '모두 쓰러졌어요'); return; }
      if (f.size <= 0) {
        f.dead = true; f.view.group.visible = false; G.fight = null;
        if (f.isBoss) { finish(true); return; }
      }
    }
  } else if (G.state === 'win' || G.state === 'lose') {
    if (G.pending && (G.endTimer -= dt) <= 0) showResult();
  }
}

/* ---------- Camera and frame ---------- */
const camPos = new THREE.Vector3(0, 9, 12);
function frame(dt) {
  step(dt);
  const run = G.state === 'running';
  player.mode = run ? 'run' : G.state === 'win' ? 'cheer' : 'idle';
  if (!run) player.tiltT = 0;
  let near = !!G.fight;
  for (const f of foes) {
    if (f.dead) continue;
    f.view.armsT = f.view.hop >= 1 ? 1 : 0;
    if (f.view.cz < G.z && G.z - f.view.cz < 16) near = true;
  }
  player.armsT = run && near ? 1 : 0;
  player.update(dt, G.t);
  Fx.update(dt);
  for (const f of foes) if (!f.dead) f.view.update(dt, G.t);

  const r = player.radius, far = portrait ? 1.25 : 1, menu = G.state === 'menu';
  const tx = G.x * 0.45, ty = (7.5 + r * 0.9) * far, tz = G.z + (10 + r * 1.3) * far;
  const k = 1 - Math.exp(-dt * 6);
  camPos.x += (tx - camPos.x) * k; camPos.y += (ty - camPos.y) * k; camPos.z += (tz - camPos.z) * k;
  camera.position.copy(camPos);
  camera.lookAt(tx, menu ? -4.5 : 0, G.z - 8);

  used = 0;
  if (G.count > 0) tag(G.x, 2.9, G.z, String(G.count), 'me');
  for (const f of foes) {
    if (f.dead || f.view.cz < G.z - 75 || f.view.cz > G.z + 3) continue;
    tag(f.view.cx, 2.8, f.view.cz, String(f.size), 'foe');
  }
  for (let i = used; i < pool.length; i++) pool[i].hidden = true;
  if (G.state === 'running') $('barFill').style.width = (clamp(G.z / level.bossZ, 0, 1) * 100).toFixed(1) + '%';

  updateFar(dt, G.z, G.t, G.state === 'running' && !G.fight);
  renderer.render(scene, camera);
}
let prev = performance.now();
function loop(now) {
  const raw = (now - prev) / 1000, dt = Math.min(0.05, raw); prev = now;
  if (Q.shadows && !Q.locked) {
    Q.slow = raw > 0.034 ? Q.slow + Math.min(raw, 0.1) : Math.max(0, Q.slow - raw);
    if (Q.slow > 2.5) setShadows(false);
  }
  frame(dt);
  requestAnimationFrame(loop);
}

/* ---------- Input ---------- */
let dragX = null;
canvas.addEventListener('pointerdown', e => { dragX = e.clientX; Sfx.ensure(); try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } });
canvas.addEventListener('pointermove', e => {
  if (dragX === null) return;
  if (G.state === 'running') G.x = clamp(G.x + (e.clientX - dragX) * 13 / Math.min(app.clientWidth, 520), -W + 0.6, W - 0.6);
  dragX = e.clientX;
});
const endDrag = () => { dragX = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
const setKey = (e, v) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = v;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = v;
  else return;
  e.preventDefault();
};
window.addEventListener('keydown', e => setKey(e, true));
window.addEventListener('keyup', e => setKey(e, false));
window.addEventListener('blur', () => { keys.l = keys.r = false; });

$('start').addEventListener('click', () => { Sfx.ensure(); startRun(false); });
$('rMain').addEventListener('click', () => { Sfx.ensure(); playStage(G.nextStage); });
$('rMap').addEventListener('click', () => { const from = G.walkFrom; G.walkFrom = 0; openMap(from); });
$('openMap').addEventListener('click', () => openMap(0));
$('mapBack').addEventListener('click', toMenu);
$('sGo').addEventListener('click', () => { Sfx.ensure(); playStage(mapSel); });
window.addEventListener('resize', () => { if (!$('map').hidden) { renderMap(); selectStage(mapSel); } });
$('rMenu').addEventListener('click', toMenu);
$('upStart').addEventListener('click', () => {
  const c = costStart(), d = Save.data;
  if (d.coins < c || d.upStart >= 30) return;
  d.coins -= c; d.upStart++; Save.store(); Sfx.ensure(); Sfx.good();
  resetRun(); refreshUI();
});
$('upIncome').addEventListener('click', () => {
  const c = costIncome(), d = Save.data;
  if (d.coins < c) return;
  d.coins -= c; d.upIncome++; Save.store(); Sfx.ensure(); Sfx.good();
  refreshUI();
});
$('mute').addEventListener('click', () => { Save.data.muted = !Save.data.muted; Save.store(); refreshUI(); });

/* ---------- Boot ---------- */
window.__game = {
  get state() { return G.state; }, get count() { return G.count; }, get x() { return G.x; }, get z() { return G.z; },
  get level() { return Save.data.level; }, get coins() { return Save.data.coins; }, get stage() { return G.stage; },
  get stars() { return Save.data.stars; }, get best() { return Save.data.best; }, starsFor,
  get data() { return level; }, genLevel, applyOp,
  get shadows() { return Q.shadows; }, lockShadows(on) { Q.locked = true; setShadows(on); }
};
toMenu();
if (document.fonts && document.fonts.load) {
  document.fonts.load('104px Jua').then(() => { if (G.state === 'menu' && $('map').hidden) toMenu(); }).catch(() => {});
}
requestAnimationFrame(loop);
})();
</script>
