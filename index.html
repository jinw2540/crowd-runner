<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뭉쳐 달려</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=aqua-1">

<div id="app">
  <canvas id="stage"></canvas>
  <div id="labels"></div>

  <div id="hud" class="gutter" hidden>
    <span class="chip" id="hStage">스테이지 1</span>
    <div id="bar" role="progressbar" aria-label="진행도"><div id="barFill"></div></div>
    <span class="chip coin" id="hCoins">0</span>
    <button id="mute" type="button">소리 켬</button>
  </div>

  <section id="menu" class="gutter">
    <h1>뭉쳐 달려</h1>
    <div class="dock">
      <div class="dock-head">
        <span class="chip" id="mStage">스테이지 1</span>
        <span class="chip coin" id="mCoins">0</span>
      </div>
      <div class="upgrades">
        <button class="up" id="upStart" type="button">
          <b>시작 인원</b><span id="upStartNow">1명으로 출발</span><span class="cost" id="upStartCost"></span>
        </button>
        <button class="up" id="upIncome" type="button">
          <b>코인 수익</b><span id="upIncomeNow">보상 100%</span><span class="cost" id="upIncomeCost"></span>
        </button>
      </div>
      <div class="go-row">
        <button class="go" id="start" type="button">달리기</button>
        <button class="go alt" id="openMap" type="button">지도</button>
      </div>
      <p class="hint">좌우로 드래그하거나 ← → 키로 게이트를 고르세요</p>
    </div>
  </section>

  <section id="result" class="gutter" hidden>
    <div class="card">
      <h2 id="rTitle"></h2>
      <div class="stars" id="rStars" hidden></div>
      <p id="rText"></p>
      <div class="gain" id="rGain"></div>
      <button class="go" id="rMain" type="button"></button>
      <div class="two">
        <button class="go alt" id="rMap" type="button">지도</button>
        <button class="go alt" id="rMenu" type="button">업그레이드</button>
      </div>
    </div>
  </section>

  <section id="map" hidden>
    <header class="map-head gutter">
      <button class="pill" id="mapBack" type="button">돌아가기</button>
      <h2>탐험 지도</h2>
      <div class="map-chips"><span class="chip" id="mapStars"></span><span class="chip coin" id="mapCoins">0</span></div>
    </header>
    <div id="mapScroll"><div id="mapTrail" class="gutter"></div></div>
    <div id="sheet" class="gutter">
      <div class="sheet-card">
        <div class="sheet-top">
          <h3><span id="sTitle"></span><small id="sZone"></small></h3>
          <div class="stars" id="sStars"></div>
        </div>
        <p id="sBest"></p>
        <div class="feats" id="sFeats"></div>
        <p id="sNote" hidden>이미 깬 스테이지라 코인은 절반만 받아요.</p>
        <button class="go" id="sGo" type="button">달리기</button>
      </div>
    </div>
  </section>

  <p id="fail" hidden>3D 화면을 불러오지 못했어요. 네트워크 연결을 확인하고 새로 고쳐 주세요.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/renderer.js?v=aqua-2"></script>
<script src="js/characters/penguin-soft.js?v=waddle-1"></script>
<script src="js/characters/penguin-tiers.js?v=waddle-1"></script>
<script src="js/characters/crab-model.js"></script>
<script src="js/characters.js?v=vivid-1"></script>
<script src="js/crowd.js?v=brawl-1"></script>
<script src="js/environment/ice-models.js?v=ice-1"></script>
<script src="js/environment.js?v=scatter-2"></script>
<script src="js/water.js?v=aqua-2"></script>
<script src="js/scene.js?v=scatter-1"></script>
<script src="js/audio.js?v=brawl-1"></script>
<script src="js/combat.js?v=brawl-3"></script>
<script src="js/game.js?v=brawl-2"></script>
